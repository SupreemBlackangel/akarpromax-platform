<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b2854"/>
      <stop offset="50%" style="stop-color:#124a9d"/>
      <stop offset="100%" style="stop-color:#1769ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d97706"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  
  <!-- Decorative patterns -->
  <circle cx="200" cy="300" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
  <circle cx="1000" cy="80" r="120" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <rect x="700" y="50" width="400" height="300" rx="30" fill="rgba(255,255,255,0.05)"/>
  
  <!-- Content -->
  <text x="80" y="100" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="white">عقارات للبيع والإيجار</text>
  <text x="80" y="155" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.75)">آلاف العقارات في جميع أنحاء المملكة</text>
  
  <!-- Stats -->
  <text x="80" y="220" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="url(#gold)">+5000</text>
  <text x="80" y="260" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.7)">عقار مسجل</text>
  
  <text x="280" y="220" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="url(#gold)">+1200</text>
  <text x="280" y="260" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.7)">عميل سعيد</text>
  
  <text x="480" y="220" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="url(#gold)">+800</text>
  <text x="480" y="260" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.7)">مكتب عقاري</text>
  
  <!-- CTA -->
  <rect x="80" y="300" width="180" height="48" rx="24" fill="url(#gold)"/>
  <text x="170" y="330" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">تصفح العقارات</text>
</svg>