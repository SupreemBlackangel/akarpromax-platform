<svg xmlns="http://www.w3.org/2000/svg" width="180" height="225" viewBox="0 0 180 225">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="180" height="225" rx="12" fill="url(#bg)"/>
  
  <!-- Content -->
  <text x="90" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">مكاتب عقارية</text>
  <text x="90" y="75" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">شركاؤك الموثوقون</text>
  
  <!-- Office icon -->
  <rect x="55" y="95" width="70" height="50" rx="8" fill="rgba(255,255,255,0.15)"/>
  <text x="90" y="125" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle">🏢</text>
  
  <!-- Stats -->
  <text x="90" y="175" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">+200</text>
  <text x="90" y="195" font-family="Arial, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">مكتب مسجل</text>
  
  <!-- CTA -->
  <rect x="30" y="205" width="120" height="16" rx="8" fill="rgba(255,255,255,0.2)"/>
  <text x="90" y="217" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle">اكتشف المكاتب</text>
</svg>