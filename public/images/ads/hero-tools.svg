<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#064e3b"/>
      <stop offset="50%" style="stop-color:#047857"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  
  <!-- Decorative -->
  <circle cx="150" cy="350" r="200" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
  <circle cx="1050" cy="50" r="150" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  
  <!-- Content -->
  <text x="80" y="100" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="white">أدوات هندسية متقدمة</text>
  <text x="80" y="155" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.8)">حاسبات · مخططات · أدوات احترافية</text>
  
  <!-- Tool icons as shapes -->
  <rect x="80" y="200" width="120" height="80" rx="12" fill="rgba(255,255,255,0.15)"/>
  <text x="140" y="250" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">حاسبة الراتب</text>
  
  <rect x="220" y="200" width="120" height="80" rx="12" fill="rgba(255,255,255,0.15)"/>
  <text x="280" y="250" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">حاسبة القرض</text>
  
  <rect x="360" y="200" width="120" height="80" rx="12" fill="rgba(255,255,255,0.15)"/>
  <text x="420" y="250" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">مخطط المشاريع</text>
  
  <!-- CTA -->
  <rect x="80" y="310" width="160" height="48" rx="24" fill="rgba(255,255,255,0.2)"/>
  <text x="160" y="340" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">جرب الآن</text>
</svg>