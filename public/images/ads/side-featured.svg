<svg xmlns="http://www.w3.org/2000/svg" width="180" height="225" viewBox="0 0 180 225">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#08265b"/>
      <stop offset="100%" style="stop-color:#1672e8"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="180" height="225" rx="12" fill="url(#bg)"/>
  
  <!-- Content -->
  <text x="90" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">عقارات مميزة</text>
  <text x="90" y="75" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.7)" text-anchor="middle">فرص استثمارية</text>
  
  <!-- Decorative -->
  <rect x="20" y="100" width="140" height="80" rx="8" fill="rgba(255,255,255,0.1)"/>
  <text x="90" y="145" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#f59e0b" text-anchor="middle">VIP</text>
  
  <!-- CTA -->
  <rect x="30" y="195" width="120" height="24" rx="12" fill="rgba(255,255,255,0.2)"/>
  <text x="90" y="212" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle">عرض التفاصيل</text>
</svg>