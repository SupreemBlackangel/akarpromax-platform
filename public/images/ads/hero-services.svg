<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#08265b"/>
      <stop offset="50%" style="stop-color:#0b3f91"/>
      <stop offset="100%" style="stop-color:#1672e8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="50" r="150" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
  <circle cx="1100" cy="350" r="200" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <circle cx="900" cy="100" r="80" fill="rgba(255,255,255,0.05)"/>
  
  <!-- Content -->
  <text x="80" y="120" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="start">خدمات عقارية متكاملة</text>
  <text x="80" y="180" font-family="Arial, sans-serif" font-size="24" fill="rgba(255,255,255,0.8)" text-anchor="start">استشارات · تقييم · إدارة · تسويق</text>
  
  <!-- CTA Button -->
  <rect x="80" y="220" width="200" height="50" rx="25" fill="url(#accent)"/>
  <text x="180" y="252" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white" text-anchor="middle">اكتشف المزيد</text>
  
  <!-- Decorative elements -->
  <rect x="600" y="80" width="500" height="240" rx="20" fill="rgba(255,255,255,0.1)"/>
  <text x="850" y="180" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="rgba(255,255,255,0.2)" text-anchor="middle">عقار</text>
  <text x="850" y="250" font-family="Arial, sans-serif" font-size="36" fill="rgba(255,255,255,0.15)" text-anchor="middle">PRO MAX</text>
</svg>